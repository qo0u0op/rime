name: package-rime

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test tools
        run: python3 -m unittest discover -s tools/tests -v

      - name: Package Rime files
        run: |
          set -euo pipefail
          packages=(
            "rime-config-desktop-all all desktop"
            "rime-config-desktop-flypy flypy desktop"
            "rime-config-desktop-lisp lisp desktop"
            "rime-config-mobile-all all mobile"
          )
          for entry in "${packages[@]}"; do
            read -r name variant platform <<<"$entry"
            bash tools/package_rime.sh "dist/$name" "$variant" "$platform"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-all
          path: dist/rime-config-desktop-all

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-flypy
          path: dist/rime-config-desktop-flypy

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-lisp
          path: dist/rime-config-desktop-lisp

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-mobile-all
          path: dist/rime-config-mobile-all

      - name: Zip packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          cd dist
          for dir in rime-config-*; do
            [[ -d "$dir" ]] || continue
            zip -qr "$dir.zip" "$dir"
          done
          ls -lh ./*.zip

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
