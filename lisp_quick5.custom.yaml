# lisp_quick5.custom.yaml
# 闊碼速成客製化設定

patch:
  # 1. 將 `\` 符號加入 speller 字母表
  speller/alphabet: 'zyxwvutsrqponmlkjihgfedcba/\'

  # 2. LaTeX translator
  translator_latex:
    __include: latex.schema:/translator
    tag: translator_latex
    prefix: '\\'
    suffix: ' '
    tips: Latex

  # 3. translator 列表
  engine/translators:
    - punct_translator
    - table_translator@translator_latex
    - script_translator

  # 4. segmentor 列表
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@translator_latex
    - punct_segmentor
    - fallback_segmentor

  # 5. 符號表
  punctuator/import_preset: symbols
  punctuator/symbols:
    '/nm0': [〇, 零, ₀, ⁰, ⓪, ⓿ , ０]
    '/nm1': [一, 壹, ₁, ¹, Ⅰ, ⅰ, ①, ➀, ❶, ➊, ⓵, ⑴, ⒈, １, ㊀, ㈠, 弌, 壱, 幺, ㆒ ]
    '/nm2': [二, 貳, ₂, ², Ⅱ, ⅱ, ②, ➁, ❷, ➋, ⓶, ⑵, ⒉, ２, ㊁, ㈡, 弍, 弐, 貮, 㒃, 㒳, 兩, 倆, ㆓]
    '/nm3': [三, 叄, ₃, ³, Ⅲ, ⅲ, ③, ➂, ❸, ➌, ⓷, ⑶, ⒊, ３, ㊂, ㈢, 參, 参, 叁, 弎, 仨, ㆔]
    '/nm4': [四, 肆, ₄, ⁴, Ⅳ, ⅳ, ④, ➃, ❹, ➍, ⓸, ⑷, ⒋, ４, ㊃, ㈣, 亖]
    '/nm5': [五, 伍, ₅, ⁵, Ⅴ, ⅴ, ⑤, ➄, ❺, ➎, ⓹, ⑸, ⒌, ５, ㊄, ㈤, 㐅, 㠪, 𠄡 ]
    '/nm6': [六, 陸, ₆, ⁶, Ⅵ, ⅵ, ⑥, ➅, ❻, ➏, ⓺, ⑹, ⒍, ６, ㊅, ㈥, ↅ]
    '/nm7': [七, 柒, ₇, ⁷, Ⅶ, ⅶ, ⑦, ➆, ❼, ➐, ⓻, ⑺, ⒎, ７, ㊆, ㈦, 漆]
    '/nm8': [八, 捌, ₈, ⁸, Ⅷ, ⅷ, ⑧, ➇, ❽, ➑, ⓼, ⑻, ⒏, ８, ㊇, ㈧ ]
    '/nm9': [九, 玖, ₉, ⁹, Ⅸ, ⅸ, ⑨, ➈, ❾, ➒, ⓽, ⑼, ⒐, ９, ㊈, ㈨ ]
    '/nm10': [十, 拾, ₁₀, ¹⁰, Ⅹ, ⅹ, ⑩, ➉, ❿, ➓, ⓾, ⑽, ⒑, １０, ㊉, ㈩, 什 ]

  # 6. 觸發規則
  recognizer:
    patterns:
      translator_latex: "^\\\\[a-zA-Z^_]+$"
      punct: '^/(nm([0-9]|10)|[A-Za-z]+)$'

# grammar 八股文
__patch:
  - patch/+:
      __include: grammar:/hant
