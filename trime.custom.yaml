        - { click: BackSpace, width: 15 }
    flypy_self:
      ascii_mode: 0
      height: 44
      keys:
        [
          { click: 1, long_click: "!" },
          { click: 2, long_click: "@" },
          { click: 3, long_click: "#" },
          { click: 4, long_click: "$" },
          { click: 5, long_click: "%" },
          { click: 6, long_click: "^" },
          { click: 7, long_click: "&" },
          { click: 8, long_click: "*" },
          { click: 9, long_click: "(" },
          { click: 0, long_click: ")" },
          { click: q, long_click: _ },
          { click: w, long_click: "-" },
          { click: e, long_click: "+" },
          { click: r, long_click: "=" },
          { click: t, long_click: "|" },
          { click: y, long_click: "\\" },
          { click: u, long_click: "[" },
          { click: i, long_click: "]" },
          { click: o, long_click: "{" },
          { click: p, long_click: "}" },
          { width: 5 },
          { click: a, long_click: select_all },
          { click: s, long_click: Home },
          { click: d, long_click: End },
          { click: f, long_click: Page_Up },
          { click: g, long_click: Page_Down },
          { click: h, long_click: Left },
          { click: j, long_click: Down },
          { click: k, long_click: ":" },
          { click: l, long_click: ";" },
          { width: 5 },
          { click: Shift_L, has_menu: "'", width: 15 },
          { click: z, long_click: "`" },
          { click: x, long_click: cut },
          { click: c, long_click: copy },
          { click: v, long_click: paste },
          { click: b, long_click: "~" },
          { click: n, long_click: "\"" },
          { click: m, long_click: MoeDict },
          { click: BackSpace, width: 15 },
          { click: Mode_switch, long_click: Menu, width: 15 },
          { click: Keyboard_symbols, long_click: Keyboard_number },
          { click: ",", long_click: "<" },
          { click: space, width: 30 },
          { click: ., long_click: ">" },
          { click: "/", long_click: "?" },
          { click: Return, composing: Return1, long_click: CommitComment, width: 15 },
        ]
      label_transform: uppercase
      lock: true
      name: "預設36鍵"
      width: 10
