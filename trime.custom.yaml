patch:
  preset_keyboards:
    lisp_quick5:
      name: Colemak-DH
      ascii_mode: 1
      lock: true
      width: 10
      columns: 10
      height: 44
      label_transform: uppercase
      keys:
        # Row 1: q w f p b j l u y ;
        - { click: q }
        - { click: w }
        - { click: f }
        - { click: p }
        - { click: b }
        - { click: j }
        - { click: l }
        - { click: u }
        - { click: y }
        - { click: ";", swipe_up: ":" }
        # Row 2: a r s t g m n e i o (swipe_up 1-0)
        - { click: a, swipe_up: "1", hint: "1" }
        - { click: r, swipe_up: "2", hint: "2" }
        - { click: s, swipe_up: "3", hint: "3" }
        - { click: t, swipe_up: "4", hint: "4" }
        - { click: g, swipe_up: "5", hint: "5" }
        - { click: m, swipe_up: "6", hint: "6" }
        - { click: n, swipe_up: "7", hint: "7" }
        - { click: e, swipe_up: "8", hint: "8" }
        - { click: i, swipe_up: "9", hint: "9" }
        - { click: o, swipe_up: "0", hint: "0" }
        # Row 3: z x c d v k h , . /
        - { click: z }
        - { click: x }
        - { click: c }
        - { click: d }
        - { click: v }
        - { click: k }
        - { click: h }
        - { click: ",", swipe_up: "<" }
        - { click: ., swipe_up: ">" }
        - { click: "/", swipe_up: "?" }
        # Row 4: 比例 1.5u:1.5u:2u:2u:1.5u:1.5u = 15:15:20:20:15:15 = 100
        - { click: Shift_L, width: 15 }
        - { click: Keyboard_number, width: 15 }
        - { click: space, swipe_up: Mode_switch, width: 20 }
        - { click: Return, width: 20 }
        - { click: Keyboard_symbols, width: 15 }
        - { click: BackSpace, width: 15 }
    flypy_quick5:
      name: Colemak-DH
      ascii_mode: 1
      lock: true
      width: 10
      columns: 10
      height: 44
      label_transform: uppercase
      keys:
        # Row 1: q w f p b j l u y ;
        - { click: q }
        - { click: w }
        - { click: f }
        - { click: p }
        - { click: b }
        - { click: j }
        - { click: l }
        - { click: u }
        - { click: y }
        - { click: ";", swipe_up: ":" }
        # Row 2: a r s t g m n e i o (swipe_up 1-0)
        - { click: a, swipe_up: "1", hint: "1" }
        - { click: r, swipe_up: "2", hint: "2" }
        - { click: s, swipe_up: "3", hint: "3" }
        - { click: t, swipe_up: "4", hint: "4" }
        - { click: g, swipe_up: "5", hint: "5" }
        - { click: m, swipe_up: "6", hint: "6" }
        - { click: n, swipe_up: "7", hint: "7" }
        - { click: e, swipe_up: "8", hint: "8" }
        - { click: i, swipe_up: "9", hint: "9" }
        - { click: o, swipe_up: "0", hint: "0" }
        # Row 3: z x c d v k h , . /
        - { click: z }
        - { click: x }
        - { click: c }
        - { click: d }
        - { click: v }
        - { click: k }
        - { click: h }
        - { click: ",", swipe_up: "<" }
        - { click: ., swipe_up: ">" }
        - { click: "/", swipe_up: "?" }
        # Row 4: 比例 1.5u:1.5u:2u:2u:1.5u:1.5u = 15:15:20:20:15:15 = 100
        - { click: Shift_L, width: 15 }
        - { click: Keyboard_number, width: 15 }
