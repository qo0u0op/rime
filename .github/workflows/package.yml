name: package-rime

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test tools
        run: python3 -m unittest discover -s tools/tests -v

      - name: Package Rime files
        run: |
          bash tools/package_rime.sh dist/rime-config-desktop-all all desktop
          bash tools/package_rime.sh dist/rime-config-desktop-flypy flypy desktop
          bash tools/package_rime.sh dist/rime-config-desktop-lisp lisp desktop
          bash tools/package_rime.sh dist/rime-config-mobile-all all mobile

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-all
          path: dist/rime-config-desktop-all

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-flypy
          path: dist/rime-config-desktop-flypy

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-desktop-lisp
          path: dist/rime-config-desktop-lisp

      - uses: actions/upload-artifact@v4
        with:
          name: rime-config-mobile-all
          path: dist/rime-config-mobile-all
