# lisp_quick5.custom.yaml（行動版）
# 闊碼速成客製化設定（行動版）

patch:

  # 倉頡反查 translator
  translator_cangjie5:
    dictionary: cangjie5
    prism: cangjie5
    prefix: "`c"
    tag: translator_cangjie5
    tips: "〔倉頡〕"
    preedit_format:
      - "xform/^([a-z]*)$/$1\\t（\\U$1\\E）/"
      - "xlit|ABCDEFGHIJKLMNOPQRSTUVWXYZ|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"
    enable_charset_filter: true
    enable_encoder: false
    enable_sentence: false
    max_phrase_length: 5
    disable_user_dict_for_patterns:
      - "^z.*$"
      - "^yyy.*$"

  # translator 列表
  engine/translators:
    - punct_translator
    - table_translator@translator_cangjie5
    - script_translator

  # segmentor 列表
  engine/segmentors:
    - ascii_segmentor
    - matcher
    - affix_segmentor@translator_cangjie5
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor

  # 以詞定字：< 選首字、> 選末字（見 lua/select_character.lua）
  # 可改 bracketleft/bracketright（[]）或 braceleft/braceright（{}）
  'engine/processors/@before 0': lua_processor@*select_character
  key_binder/select_first_character: less
  key_binder/select_last_character: greater

  # 行動版：不顯示增廣／符號開關，保留註解切換
  switches:
    - name: t2s
      reset: 0
      states: [漢字, 汉字]
    - name: full_shape
      reset: 0
      states: [半角, 全角]
    - name: ascii_mode
      reset: 0
      states: [中文, 西文]
    - name: cangjie_comment
      reset: 1
      states: [字母, 字根]

  # 候選排序：詞 -> 全碼字 -> 其他同音字（見 rime.lua）
  engine/filters:
    - simplifier@t2s
    - lua_filter@code_order_filter
    - lua_filter@cangjie_comment_filter
    - uniquifier
    - cjk_minifier

  # 6. 符號表
  punctuator/import_preset: symbols
  punctuator/symbols:
    '/nm0': [〇, 零, ₀, ⁰, ⓪, ⓿ , ０]
    '/nm1': [一, 壹, ₁, ¹, Ⅰ, ⅰ, ①, ➀, ❶, ➊, ⓵, ⑴, ⒈, １, ㊀, ㈠, 弌, 壱, 幺, ㆒ ]
    '/nm2': [二, 貳, ₂, ², Ⅱ, ⅱ, ②, ➁, ❷, ➋, ⓶, ⑵, ⒉, ２, ㊁, ㈡, 弍, 弐, 貮, 㒃, 㒳, 兩, 倆, ㆓]
    '/nm3': [三, 叄, ₃, ³, Ⅲ, ⅲ, ③, ➂, ❸, ➌, ⓷, ⑶, ⒊, ３, ㊂, ㈢, 參, 参, 叁, 弎, 仨, ㆔]
    '/nm4': [四, 肆, ₄, ⁴, Ⅳ, ⅳ, ④, ➃, ❹, ➍, ⓸, ⑷, ⒋, ４, ㊃, ㈣, 亖]
    '/nm5': [五, 伍, ₅, ⁵, Ⅴ, ⅴ, ⑤, ➄, ❺, ➎, ⓹, ⑸, ⒌, ５, ㊄, ㈤, 㐅, 㠪, 𠄡 ]
    '/nm6': [六, 陸, ₆, ⁶, Ⅵ, ⅵ, ⑥, ➅, ❻, ➏, ⓺, ⑹, ⒍, ６, ㊅, ㈥, ↅ]
    '/nm7': [七, 柒, ₇, ⁷, Ⅶ, ⅶ, ⑦, ➆, ❼, ➐, ⓻, ⑺, ⒎, ７, ㊆, ㈦, 漆]
    '/nm8': [八, 捌, ₈, ⁸, Ⅷ, ⅷ, ⑧, ➇, ❽, ➑, ⓼, ⑻, ⒏, ８, ㊇, ㈧ ]
    '/nm9': [九, 玖, ₉, ⁹, Ⅸ, ⅸ, ⑨, ➈, ❾, ➒, ⓽, ⑼, ⒐, ９, ㊈, ㈨ ]
    '/nm10': [十, 拾, ₁₀, ¹⁰, Ⅹ, ⅹ, ⑩, ➉, ❿, ➓, ⓾, ⑽, ⒑, １０, ㊉, ㈩, 什 ]

  # 觸發規則
  recognizer:
    patterns:
      translator_cangjie5: "^`c[a-z]*$"
      punct: '^/(nm([0-9]|10)|[A-Za-z]+)$'

# grammar 八股文
__patch:
  - patch/+:
      __include: grammar:/hant
